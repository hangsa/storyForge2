id: xianxia
label_zh: 仙侠
label_en: Xianxia
family: cultivation
pacing:
  min_beats_per_1k: 1.2
  escalation_interval: 5
  action_ratio: 0.35
  max_consecutive_non_action: 3
  chapter_words:
    min: 3000
    max: 7000
  scene_words:
    min: 600
    max: 2500
tone: |
  飘逸出尘，意境深远。修炼不仅是力量的增长，更是心境的提升。
  道法自然，因果循环。主角在求道之路上经历劫难，领悟天道。
  语言要求有古韵和仙气，避免过于口语化。
style_rules:
- 境界突破必须描写天地异象，层次越高异象越壮观
- 法宝和功法要有意境化的名称和来历
- 修炼过程要穿插对天道法则的感悟
- 战斗场景需描写术法神通的变化和克制关系
- 每章至少有一段意境化描写（山水/天道/心魔）
- 对话需体现修道者的气度和智慧，忌粗俗
- 因果报应要在叙事中体现，不可随意杀戮
writing_formula:
  sentence:
    avg_length_max: 35
    short_pct_min: 25
    long_pct_max: 25
  dialogue:
    ratio_min: 0.15
    max_consecutive_lines: 10
  paragraph:
    max_sentences: 6
    max_words: 350
  emotional_beat_density_min: 1.0
  satisfaction_beat_min: 2
  suspense_hook_required: true
taboo_words:
- 无聊
- 没意思
- 算了不修了
- 太麻烦了
- 牛逼
- 卧槽
- '666'
- OK
- 没有因果
- 随便杀人
taboos:
- name: 修为倒退
  type: sliding_window
  keywords:
  - 修为跌落
  - 境界倒退
  - 功力尽失
  - 废了修为
  - 修为被废
  - 道基受损
  max_chars: 400
  severity: warning
- name: 心境崩坏
  type: sliding_window
  keywords:
  - 心魔失控
  - 走火入魔
  - 道心破碎
  - 执念成魔
  - 堕入魔道
  max_chars: 300
  severity: error
- name: 过度杀戮
  type: consecutive_match
  failure_keywords:
  - 斩杀
  - 灭杀
  - 屠尽
  - 灭门
  - 血洗
  - 屠戮
  max_consecutive: 3
  severity: warning
trope_patterns:
- name: 境界突破
  description: 主角突破修炼瓶颈，引发天地异象
  min_interval: 3
- name: 秘境机缘
  description: 探索上古秘境或遗迹获得传承
  max_per_volume: 2
- name: 宗门大比
  description: 宗门内部或门派之间的比武大会
  min_interval: 8
- name: 天地大劫
  description: 天道轮回引发的大规模劫难
  max_per_volume: 1
- name: 因果了结
  description: 前世的因果或恩怨在今生清算
  min_interval: 10
beat_patterns:
  - keywords: [境界突破, 突破, 飞升, 晋升]
    priority: 85
    beats:
      - { description: "境界壁垒感知：修士意识到瓶颈与契机",             words: 500, focus: "sensory" }
      - { description: "闭关修炼：灵气运转、功法运转、心境磨练",           words: 1000, focus: "action" }
      - { description: "突破瞬间：天地异象、力量升华、旁人震惊",           words: 900, focus: "reveal" }
      - { description: "新境界感知：感官扩展、神识变化、寿命延长",         words: 600, focus: "emotion" }
  - keywords: [宗门大比, 比武, 擂台, 论道, 选拔]
    priority: 75
    beats:
      - { description: "赛前氛围：规则宣布、对手出场、赌注/奖励",          words: 500, focus: "sensory" }
      - { description: "前期对战：试探性交锋、展示修为底蕴",               words: 800, focus: "action" }
      - { description: "核心对战：功法对抗、术法克制、险象环生",           words: 1000, focus: "action" }
      - { description: "胜负揭晓：底牌对决、意外变故",                     words: 700, focus: "reveal" }
      - { description: "赛后余波：名次确定、新的挑战预告",                 words: 400, focus: "emotion" }
  - keywords: [秘境, 遗迹, 上古, 仙府, 探索]
    priority: 70
    beats:
      - { description: "秘境入口：危险预兆、历史背景暗示",                 words: 500, focus: "sensory" }
      - { description: "探索与危机：禁制、守护兽、阵法",                   words: 1000, focus: "action" }
      - { description: "核心发现：传承/法宝/秘密出现",                     words: 800, focus: "reveal" }
      - { description: "收获与离开：获得机缘、脱险、伏笔",                 words: 500, focus: "emotion" }
  - keywords: [因果, 了结, 恩怨, 前世, 清算]
    priority: 80
    beats:
      - { description: "因果浮现：前世/宿怨线索激活",                     words: 600, focus: "suspense" }
      - { description: "清算过程：双方对峙、陈年往事揭示",                 words: 900, focus: "dialogue" }
      - { description: "了断结局：恩怨归零、新关系建立",                   words: 600, focus: "emotion" }
  - keywords: [天劫, 渡劫, 心魔, 大劫]
    priority: 95
    beats:
      - { description: "劫云汇聚：天地异变、劫雷酝酿",                     words: 600, focus: "sensory" }
      - { description: "渡劫过程：法力对抗、身躯淬炼、心境考验",           words: 1200, focus: "action" }
      - { description: "心魔降临：执念显化、内心抉择",                     words: 800, focus: "dialogue" }
      - { description: "渡劫成功/失败：飞升/陨落、天地回应",               words: 600, focus: "reveal" }
