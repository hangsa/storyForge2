id: xianxia
label_zh: 仙侠
label_en: Xianxia
family: cultivation
pacing:
  min_beats_per_1k: 1.2
  escalation_interval: 5
  action_ratio: 0.35
  max_consecutive_non_action: 3
  chapter_words:
    min: 3000
    max: 7000
  scene_words:
    min: 600
    max: 2500
tone: |
  飘逸出尘，意境深远。修炼不仅是力量的增长，更是心境的提升。
  道法自然，因果循环。主角在求道之路上经历劫难，领悟天道。
  语言要求有古韵和仙气，避免过于口语化。
style_rules:
- 境界突破必须描写天地异象，层次越高异象越壮观
- 法宝和功法要有意境化的名称和来历
- 修炼过程要穿插对天道法则的感悟
- 战斗场景需描写术法神通的变化和克制关系
- 每章至少有一段意境化描写（山水/天道/心魔）
- 对话需体现修道者的气度和智慧，忌粗俗
- 因果报应要在叙事中体现，不可随意杀戮
writing_formula:
  sentence:
    avg_length_max: 35
    short_pct_min: 25
    long_pct_max: 25
  dialogue:
    ratio_min: 0.15
    max_consecutive_lines: 10
  paragraph:
    max_sentences: 6
    max_words: 350
  emotional_beat_density_min: 1.0
  satisfaction_beat_min: 2
  suspense_hook_required: true
taboo_words:
- 无聊
- 没意思
- 算了不修了
- 太麻烦了
- 牛逼
- 卧槽
- '666'
- OK
- 没有因果
- 随便杀人
taboos:
- name: 修为倒退
  type: sliding_window
  keywords:
  - 修为跌落
  - 境界倒退
  - 功力尽失
  - 废了修为
  - 修为被废
  - 道基受损
  max_chars: 400
  severity: warning
- name: 心境崩坏
  type: sliding_window
  keywords:
  - 心魔失控
  - 走火入魔
  - 道心破碎
  - 执念成魔
  - 堕入魔道
  max_chars: 300
  severity: error
- name: 过度杀戮
  type: consecutive_match
  failure_keywords:
  - 斩杀
  - 灭杀
  - 屠尽
  - 灭门
  - 血洗
  - 屠戮
  max_consecutive: 3
  severity: warning
trope_patterns:
- name: 境界突破
  description: 主角突破修炼瓶颈，引发天地异象
  min_interval: 3
- name: 秘境机缘
  description: 探索上古秘境或遗迹获得传承
  max_per_volume: 2
- name: 宗门大比
  description: 宗门内部或门派之间的比武大会
  min_interval: 8
- name: 天地大劫
  description: 天道轮回引发的大规模劫难
  max_per_volume: 1
- name: 因果了结
  description: 前世的因果或恩怨在今生清算
  min_interval: 10
# TODO: tune for xianxia — copied from config/genre_thresholds.yaml "奇幻" block
# (closest cultivation-family mate). Replace with hand-authored xianxia values.
thresholds:
  addiction_critical: 40
  addiction_moderate: 28
  frustration_high: 70
  frustration_moderate: 55
  fatigue_moderate: 50
  fatigue_low: 38
  fatigue_formula:
    threshold: 60
    decay: 1.0
  curiosity_moderate: 25
  curiosity_low: 12
  tension_moderate: 60
  tension_low: 45
  satisfaction_moderate: 50
  satisfaction_low: 35
  discussion_high: 55
  discussion_moderate: 40
model_preferences:
  creative_core: deepseek-chat
  temperature: 0.85
fusion_meta:
  # Per-pair distances mirror 1 - compatibility.yaml matrix[xianxia][other].
  # The Task 2 loader should add a consistency check:
  #   abs(distance + compatibility - 1.0) < 0.05
  distances:
    cool_novel: 0.25
    xuanhuan: 0.5
    dushi: 0.8
    kehuan: 0.8
    xuanyi: 0.8
    yanqing: 0.8
