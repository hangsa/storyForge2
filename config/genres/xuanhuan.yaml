id: xuanhuan
label_zh: 玄幻
label_en: Xuanhuan
family: cultivation
pacing:
  min_beats_per_1k: 1.4
  escalation_interval: 4
  action_ratio: 0.4
  max_consecutive_non_action: 2
  chapter_words:
    min: 3000
    max: 6000
  scene_words:
    min: 500
    max: 2200
tone: |
  宏大气魄，热血激昂。世界辽阔，种族林立，主角在波澜壮阔的
  时代洪流中崛起。战斗描写要有毁灭感和史诗感，情感要真挚浓烈。
style_rules:
- 战斗场景要有地形改变和环境破坏描写，体现力量层次
- 血脉或传承觉醒时要有完整的异象和内心变化描写
- 每10章至少引入一个新的势力或种族拓展世界观
- 主角成长要有明确的阶段标志（血脉等级/战兽进化/领地扩张）
- 大型战争场景需兼顾宏观战场和个人对决
- 奇遇和机缘要有代价或隐患，不能无代价变强
- 配角要有独立的动机和成长线，不能只是主角的陪衬
writing_formula:
  sentence:
    avg_length_max: 32
    short_pct_min: 30
    long_pct_max: 22
  dialogue:
    ratio_min: 0.2
    max_consecutive_lines: 8
  paragraph:
    max_sentences: 5
    max_words: 300
  emotional_beat_density_min: 1.4
  satisfaction_beat_min: 3
  suspense_hook_required: true
taboo_words:
- 放弃抵抗
- 我不行了
- 太强了打不过
- 就这样吧
- 无聊的战斗
- 魔法师
- 骑士精神
taboos:
- name: 血统至上
  type: sliding_window
  keywords:
  - 血脉压制
  - 天生高贵
  - 血统无敌
  - 出身决定一切
  - 低贱血脉
  - 血脉歧视
  max_chars: 300
  severity: warning
- name: 无代价变强
  type: consecutive_match
  failure_keywords:
  - 轻松突破
  - 轻易获得
  - 无人能挡
  - 秒杀
  - 碾压一切
  - 毫无压力
  max_consecutive: 2
  severity: error
- name: 猥琐发育
  type: sliding_window
  keywords:
  - 躲起来修炼
  - 不敢出面
  - 苟且偷生
  - 胆小怕事
  - 缩头乌龟
  - 贪生怕死
  max_chars: 250
  severity: error
trope_patterns:
- name: 血脉觉醒
  description: 主角血脉力量苏醒，实力大幅提升
  min_interval: 5
- name: 魔兽契约
  description: 与强大魔兽/神兽签订契约
  max_per_volume: 2
- name: 遗迹探索
  description: 探索远古遗迹获得传承或神器
  min_interval: 4
- name: 大陆争霸
  description: 势力之间的领土和资源争夺
  min_interval: 8
- name: 位面战争
  description: 不同位面/大陆之间的全面战争
  max_per_volume: 1
beat_patterns:
  - keywords: [血脉觉醒, 觉醒, 血脉, 传承]
    priority: 85
    beats:
      - { description: "异象显现：天地灵气异动、纹路浮现",                words: 500, focus: "sensory" }
      - { description: "觉醒过程：血脉共鸣、力量灌体、记忆闪现",          words: 1000, focus: "action" }
      - { description: "觉醒完成：血脉能力具象、旁人震惊",                words: 800, focus: "reveal" }
      - { description: "后续影响：身份重估、势力拉拢",                    words: 600, focus: "emotion" }
  - keywords: [遗迹, 遗迹探索, 宝藏, 古迹]
    priority: 70
    beats:
      - { description: "遗迹入口：环境描写、历史背景",                    words: 500, focus: "sensory" }
      - { description: "探索过程：机关陷阱、守护兽",                     words: 1000, focus: "action" }
      - { description: "核心传承：功法/神器/血脉获得",                    words: 800, focus: "reveal" }
      - { description: "脱险撤离：伏笔埋设、新目标",                     words: 500, focus: "emotion" }
  - keywords: [大陆争霸, 争霸, 领土, 势力争夺]
    priority: 65
    beats:
      - { description: "势力格局：多方势力、利益冲突",                    words: 500, focus: "dialogue" }
      - { description: "策略博弈：外交、军事、资源争夺",                  words: 900, focus: "action" }
      - { description: "决战时刻：势力对决、领土易主",                    words: 800, focus: "reveal" }
  - keywords: [位面战争, 位面, 跨界, 异位面]
    priority: 90
    beats:
      - { description: "危机降临：异位面入侵预警、空间裂缝",              words: 600, focus: "sensory" }
      - { description: "位面对峙：跨位面战争、规则碰撞",                  words: 1000, focus: "action" }
      - { description: "战略转折：发现弱点、反攻契机",                    words: 800, focus: "reveal" }
      - { description: "战争结局：位面格局重塑、新秩序",                  words: 600, focus: "emotion" }
  - keywords: [魔兽, 神兽, 契约, 签订契约]
    priority: 60
    beats:
      - { description: "魔兽现身：威压释放、众人反应",                    words: 500, focus: "sensory" }
      - { description: "契约谈判：考验过程、灵魂共鸣",                    words: 900, focus: "dialogue" }
      - { description: "契约达成：魔兽认主、战斗配合",                    words: 700, focus: "reveal" }
