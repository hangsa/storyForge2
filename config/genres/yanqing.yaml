id: yanqing
label_zh: 言情
label_en: Romance
family: romance
pacing:
  min_beats_per_1k: 0.8
  escalation_interval: 6
  action_ratio: 0.15
  max_consecutive_non_action: 6
  chapter_words:
    min: 2000
    max: 5000
  scene_words:
    min: 400
    max: 1800
tone: |
  细腻温柔，情感真挚。注重人物的内心世界和情感变化。
  关系的每一步发展都需要充分的铺垫和心理描写。
  语言要有温度，场景要有氛围。甜度与虐度要有节奏交替。
style_rules:
- 每章至少有一个情感互动场景（对话/独处/心理活动）
- 关系转折必须有充分的铺垫（至少3章的伏笔）
- 内心独白占比不低于15%，展现角色的情感挣扎
- 环境和氛围描写要服务于情感基调（雨/阳光/月色/季节）
- 配角和主角的关系线要有独立发展
- 对话要体现人物关系的微妙变化（措辞/语气/沉默）
- 避免玛丽苏/杰克苏——角色要有真实缺陷
writing_formula:
  sentence:
    avg_length_max: 32
    short_pct_min: 25
    long_pct_max: 22
  dialogue:
    ratio_min: 0.25
    max_consecutive_lines: 12
  paragraph:
    max_sentences: 5
    max_words: 250
  emotional_beat_density_min: 1.2
  satisfaction_beat_min: 2
  suspense_hook_required: false
taboo_words:
- 无所谓
- 随便吧
- 爱怎样怎样
- 我离不开你
- 没有你我活不下去
- 工具人
- 备胎
taboos:
- name: 情感虐待
  type: sliding_window
  keywords:
  - 冷暴力
  - 精神控制
  - PUA
  - 贬低
  - 羞辱
  - 操控
  - 威胁
  - 利用感情
  max_chars: 350
  severity: error
- name: 强行推进关系
  type: consecutive_match
  failure_keywords:
  - 一见钟情
  - 爱得死去活来
  - 非他不嫁
  - 非她不娶
  - 此生只爱
  - 一眼万年
  max_consecutive: 1
  severity: warning
- name: 狗血过度
  type: sliding_window
  keywords:
  - 失忆
  - 车祸
  - 绝症
  - 替身
  - 契约婚姻
  - 不告而别
  - 带球跑
  - 灰姑娘
  max_chars: 500
  severity: warning
trope_patterns:
- name: 初见邂逅
  description: 主角间的命运般的初次相遇
  min_interval: 1
- name: 误会与和解
  description: 因误解产生矛盾而后关系修复
  min_interval: 5
- name: 第三者介入
  description: 第三方角色对关系的考验
  max_per_volume: 2
- name: 关系升级
  description: 从暧昧到确认/从恋人到更深层次关系
  min_interval: 10
- name: 外力阻挠
  description: 家庭/社会/命运对关系的阻碍
  min_interval: 8
beat_patterns:
  - keywords: [误会, 误解, 矛盾, 和解]
    priority: 70
    beats:
      - { description: "误会形成：信息差导致的认知偏差",                  words: 500, focus: "dialogue" }
      - { description: "误会加深：行为冲突、关系紧张",                    words: 700, focus: "emotion" }
      - { description: "化解过程：坦诚、第三方调停、真相揭示",            words: 700, focus: "reveal" }
  - keywords: [关系升级, 暧昧, 告白, 确认关系]
    priority: 85
    beats:
      - { description: "情感铺垫：日常相处、细节积累",                    words: 600, focus: "sensory" }
      - { description: "情感升温：关键时刻、试探",                        words: 700, focus: "dialogue" }
      - { description: "关系确认：告白/接受/确立",                        words: 600, focus: "reveal" }
      - { description: "新关系磨合：身份转换、规则建立",                  words: 500, focus: "emotion" }
  - keywords: [第三者, 情敌, 介入, 三角]
    priority: 65
    beats:
      - { description: "第三者登场：动机背景、人物魅力",                  words: 500, focus: "sensory" }
      - { description: "冲突显化：争夺、试探、紧张",                      words: 700, focus: "dialogue" }
      - { description: "关系考验：主角的选择、第三者退场",                words: 600, focus: "emotion" }
  - keywords: [外力阻挠, 家庭, 反对, 命运]
    priority: 75
    beats:
      - { description: "阻挠来源：家庭/社会/命运的压力",                  words: 500, focus: "dialogue" }
      - { description: "压力升级：威胁、限制、分离",                      words: 700, focus: "action" }
      - { description: "突破阻挠：坚持、牺牲、新平衡",                    words: 600, focus: "reveal" }
  - keywords: [情感转折, 真相, 揭示, 动摇]
    priority: 80
    beats:
      - { description: "真相浮现：过去的秘密或误会被发现",                words: 600, focus: "suspense" }
      - { description: "情感冲击：信任/信念动摇",                         words: 700, focus: "emotion" }
      - { description: "重新抉择：是去是留、新关系建立",                  words: 600, focus: "dialogue" }
thresholds:
  addiction_critical: 30
  addiction_moderate: 20
  frustration_high: 80
  frustration_moderate: 65
  fatigue_moderate: 40
  fatigue_low: 30
  fatigue_formula:
    threshold: 50
    decay: 1.5
  curiosity_moderate: 20
  curiosity_low: 10
  tension_moderate: 70
  tension_low: 55
  satisfaction_moderate: 40
  satisfaction_low: 25
  discussion_high: 70
  discussion_moderate: 55
model_preferences:
  creative_core: deepseek-chat
  temperature: 0.85
fusion_meta:
  # Per-pair distances mirror 1 - compatibility.yaml matrix[yanqing][other].
  # The Task 2 loader should add a consistency check:
  #   abs(distance + compatibility - 1.0) < 0.05
  distances:
    cool_novel: 0.8
    xianxia: 0.8
    xuanhuan: 0.8
    dushi: 0.25
    kehuan: 0.8
    xuanyi: 0.5
