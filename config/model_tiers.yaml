providers:
  deepseek:
    type: openai_compatible
    display_name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    enabled: true
    models:
      deepseek-v4-pro:
        id: deepseek-v4-pro
        provider: deepseek
        display_name: deepseek-v4-pro
        cost_per_1k_input: 0
        cost_per_1k_output: 0
        max_tokens: 393216
        temperature: 0.7
        json_mode: true
        stream: true
      deepseek-v4-flash:
        id: deepseek-v4-flash
        provider: deepseek
        display_name: deepseek-v4-flash
        cost_per_1k_input: 0
        cost_per_1k_output: 0
        max_tokens: 393216
        temperature: 0.7
        json_mode: false
        stream: true
  minimax:
    type: openai_compatible
    display_name: minimax
    base_url: https://api.minimax.chat/v1
    api_key_env: MINIMAX_API_KEY
    enabled: true
    models:
      MiniMax-M3:
        id: MiniMax-M3
        provider: minimax
        display_name: MiniMax-M3
        cost_per_1k_input: 0
        cost_per_1k_output: 0
        max_tokens: 524288
        temperature: 0.7
        json_mode: false
        stream: true
