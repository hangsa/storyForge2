tiers:
  tier_1:
    description: 创意核心 — 概念/世界观/角色/地图/大纲/创意引擎/成长讨论
    default: deepseek-v4-flash
    retry_on_failure: true
    max_retries: 2
    fallback: MiniMax-M3
  tier_2:
    description: Scene 写作、Narrative Guard、Novelty/Arc 分析
    default: MiniMax-M3
    retry_on_failure: true
    max_retries: 1
    fallback: deepseek-v4-flash
  tier_3:
    description: L1 细节重提取、章摘要生成、风格分类
    default: MiniMax-M3
    retry_on_failure: true
    max_retries: 1
    fallback: deepseek-v4-flash
  tier_0:
    description: Fact Guard、StoryOS SF_LOG 解析、ReaderOS 计算
    default: none
