tiers:
  tier_1:
    description: Scene 写作、STAGE 1-3 内容生成
    models:
    - claude-opus-4
    - deepseek-v4-pro
    default: deepseek-v4-pro
    retry_on_failure: true
    max_retries: 2
    fallback: claude-opus-4
  tier_2:
    description: Narrative Guard 状态漂移检测
    models:
    - claude-sonnet-4
    default: claude-sonnet-4
    retry_on_failure: true
    max_retries: 1
    fallback: null
  tier_3:
    description: L1 细节重提取、章摘要生成、风格分类
    models:
    - claude-haiku
    default: claude-haiku
    retry_on_failure: true
    max_retries: 1
    fallback: null
  tier_0:
    description: Fact Guard、StoryOS SF_LOG 解析、ReaderOS 计算
    models: []
    default: none
agent_mapping:
  planner:
    concept_generation:
      tier: tier_1
      model: default
    canvas_to_concept:
      tier: tier_1
      model: default
    world_generation:
      tier: tier_1
      model: default
    character_generation:
      tier: tier_1
      model: default
    outline_generation:
      tier: tier_1
      model: default
    novel_outline_generation:
      tier: tier_1
      model: default
    creative_brainstorming:
      tier: tier_1
      model: default
    whatif_expansion:
      tier: tier_1
      model: default
    novelty_evaluation:
      tier: tier_2
      model: default
  writer:
    scene_writing:
      tier: tier_1
      model: deepseek-v4-pro
      fallback: claude-opus-4
    scene_rewrite:
      tier: tier_1
      model: default
    context_assembly:
      tier: tier_0
  reviewer:
    fact_guard:
      tier: tier_0
    narrative_guard:
      tier: tier_2
      model: default
    style_guard:
      tier: tier_0
    coherence_scoring:
      tier: tier_0
    semantic_precheck:
      tier: tier_3
      model: default
  storyos_agent:
    sf_log_parsing:
      tier: tier_0
    cascade_propagation:
      tier: tier_0
    conflict_detection:
      tier: tier_0
    sf_log_suggestion:
      tier: tier_3
      model: default
  summary_archiver:
    chapter_summary:
      tier: tier_3
      model: default
    l1_reextraction:
      tier: tier_3
      model: default
    style_extraction:
      tier: tier_3
      model: default
  creative_director:
    creative_brainstorming:
      tier: tier_1
      model: default
    whatif_expansion:
      tier: tier_1
      model: default
    whatif_direction:
      tier: tier_1
      model: default
    mutation:
      tier: tier_1
      model: default
    path_evaluation:
      tier: tier_1
      model: default
    fusion_analysis:
      tier: tier_1
      model: default
    trope_extraction:
      tier: tier_3
      model: default
  character_designer:
    growth_discuss:
      tier: tier_1
      model: default
    growth_discussion:
      tier: tier_1
      model: default
    arc_analysis:
      tier: tier_2
      model: default
  style_sandbox:
    preview:
      tier: tier_3
providers:
  anthropic:
    type: anthropic
    display_name: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    enabled: true
    models:
      claude-opus-4:
        display_name: claude-opus-4
        cost_per_1k_input: 0.015
        cost_per_1k_output: 0.075
        max_tokens: 8192
        temperature: 0.7
        json_mode: false
        stream: true
      claude-sonnet-4:
        display_name: claude-sonnet-4
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015
        max_tokens: 4096
        temperature: 0.7
        json_mode: false
        stream: true
      claude-haiku:
        display_name: claude-haiku
        cost_per_1k_input: 0.00025
        cost_per_1k_output: 0.00125
        max_tokens: 2048
        temperature: 0.7
        json_mode: false
        stream: true
  deepseek:
    type: openai_compatible
    display_name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    enabled: true
    models:
      deepseek-v4-pro:
        display_name: deepseek-v4-pro
        cost_per_1k_input: 0.002
        cost_per_1k_output: 0.008
        max_tokens: 8192
        temperature: 0.7
        json_mode: true
        stream: true
