<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryForge — Creative Narrative OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted theme before first paint. This must live here, not
      // in a React effect: several navigations (BookShelf project open, wizard
      // dismiss) are hard reloads, and a component-mounted hook would leave the
      // document dark until that component happens to render.
      (function () {
        try {
          if (localStorage.getItem("storyforge.theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the default dark theme */
        }
      })();
    </script>
  </head>
  <body class="bg-canvas-bg text-primary font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
