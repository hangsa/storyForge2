<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NebulaForge Creative Narrative OS</title>
    <link rel="preload" as="font" type="font/ttf" href="/fonts/material-symbols-outlined.ttf" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      // Apply the persisted theme before first paint. This must live here, not
      // in a React effect: several navigations (BookShelf project open, wizard
      // dismiss) are hard reloads, and a component-mounted hook would leave the
      // document dark until that component happens to render.
      (function () {
        try {
          if (localStorage.getItem("storyforge.theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the default dark theme */
        }
      })();
    </script>
  </head>
  <body class="bg-canvas-bg text-primary font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
